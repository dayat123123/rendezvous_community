name: rendezvous_community
description: >-
  Rendezvous Community: stock feed, threaded comments, reactions, mentions,
  follows, stock watchlists, realtime chat, customer support chat, and
  moderation for the Rendezvous OLT app. Backend: self-hosted Supabase and
  auth-bridge.
version: 1.15.0
publish_to: none

environment:
  sdk: ^3.12.1
  flutter: ">=3.44.0"

dependencies:
  bloc: ^9.2.1
  crypto: ^3.0.8
  drift: ^2.34.4
  file_selector: ^1.1.0
  flutter:
    sdk: flutter
  flutter_bloc: ^9.1.1
  flutter_localizations:
    sdk: flutter
  freezed_annotation: ^3.1.0
  http: ^1.6.0
  image: ^4.12.0
  intl: ^0.20.2
  json_annotation: ^4.12.0
  logging: ^1.3.0
  pasteboard: ^0.6.0
  path: ^1.9.1
  path_provider: ^2.1.6
  share_plus: ^13.3.1
  sqlite3: ^3.5.2
  supabase_flutter: ^2.18.3
  url_launcher: ^6.3.3
  uuid: ^4.6.0
  video_player: ^2.14.1

dev_dependencies:
  analyzer: ^10.2.0
  bloc_test: ^10.0.0
  build_runner: ^2.15.1
  drift_dev: ^2.34.0
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter
  freezed: ^3.2.5
  json_serializable: ^6.15.2
  mocktail: ^1.0.5

flutter:
  generate: true
