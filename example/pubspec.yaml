name: rendezvous_community_example
description: Example host app that integrates rendezvous_community (Windows, Android, web) with the local Docker stack.
publish_to: none
version: 1.0.0+1

environment:
  sdk: ^3.12.1

dependencies:
  flutter:
    sdk: flutter
  flutter_local_notifications: ^22.3.3
  flutter_localizations:
    sdk: flutter
  rendezvous_community:
    path: ../
  # Klien WebSocket OLT dummy yang jalan di Windows, Android, dan web.
  web_socket_channel: ^3.0.3

dev_dependencies:
  flutter_driver:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter
  http: ^1.6.0
  integration_test:
    sdk: flutter

flutter:
  uses-material-design: true
